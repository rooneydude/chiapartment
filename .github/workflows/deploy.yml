name: Deploy dashboard

on:
  push:
    branches: [claude/repo-reset-4my0gv, main]
  workflow_dispatch:
  workflow_call: # chained from refresh.yml after it pushes new data

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Builds the site and publishes it, as one job that only one run may be in
  # at a time.
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      # One deployment at a time, in the order they were asked for, and none
      # cut short. A merge that also starts a refresh (one that changes
      # .github/refresh-trigger) asks for two deployments of the same commit:
      # this workflow's own, and the one the refresh ends with, which carries
      # the new snapshot. When a later deployment was allowed to cancel an
      # earlier one, the second cancelled the first while it was publishing;
      # GitHub Pages kept the first one's content and reported the second a
      # success, and the site stayed one snapshot behind (23 Nov 2026, runs
      # 45156408985 and 45156409034). Queued, the second publishes after the
      # first has finished.
      #
      # The build is inside the queue with the publishing, so whichever run
      # publishes last has also built last, from the newest commit. The check
      # that follows (the verify job) is outside it: a deployment that fails
      # its check must not hold up the one that would put the page right.
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      built_at: ${{ steps.built.outputs.built_at }}
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Branch name, not SHA: when chained from refresh.yml this picks up
          # the data commit refresh just pushed.
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # When this copy of the site was built: the stamp the verify job looks
      # for on the live site.
      - name: Note what was built
        id: built
        run: npm run -s ci:built-at
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4

  # A deployment that reports success has not thereby reached the page a
  # person opens: on 23 Nov 2026 one did not, and every step was green. This
  # job looks at the live site and fails, saying what it found, unless the
  # site serves the copy this run built, or a later one, and that copy holds
  # the newest snapshot on the branch (scraper/src/verify-live.ts, which
  # `npm test` covers). The data is committed either way; what a red run here
  # means is that the page is behind.
  verify:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      # The branch as it is now, not the commit this run started from: the
      # newest snapshot on it is what the page has to show.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The site serves what was deployed
        env:
          SITE_URL: ${{ needs.publish.outputs.page_url }}
          BUILT_AT: ${{ needs.publish.outputs.built_at }}
        run: npm run -s ci:verify-live
