name: Deploy dashboard

on:
  push:
    branches: [claude/repo-reset-4my0gv, main]
  workflow_dispatch:
  workflow_call: # chained from refresh.yml after it pushes new data

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Builds the site and publishes it, as one job that only one run may be in
  # at a time.
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      # One deployment at a time, and none cut short once it has started. A
      # merge that also starts a refresh (one that changes
      # .github/refresh-trigger) asks for two deployments of the same commit:
      # this workflow's own, and the one the refresh ends with, which carries
      # the new snapshot. When a later deployment was allowed to cancel an
      # earlier one, the second cancelled the first while it was publishing;
      # GitHub Pages kept the first one's content and reported the second a
      # success, and the site stayed one snapshot behind (23 Nov 2026, runs
      # 45156408985 and 45156409034). Queued, the second publishes after the
      # first has finished.
      #
      # The queue holds one. A third deployment arriving while one waits
      # takes the waiting one's place, by GitHub's rule, and the run that was
      # waiting ends "cancelled" with nothing wrong: whichever runs next
      # builds from the branch as it is by then, so it carries all that the
      # one it replaced would have. (GitHub can keep more waiting, with
      # `queue: max`. That is not used here: it has only been read about, and
      # a key GitHub refused would stop every deployment and, very likely,
      # every refresh with them.)
      #
      # The build is inside the queue with the publishing, so whichever run
      # publishes last has also built last, from the newest commit. The check
      # that follows (the verify job) is outside it: a deployment that fails
      # its check must not hold up the one that would put the page right.
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.again.outputs.page_url || steps.deployment.outputs.page_url }}
    outputs:
      built_at: ${{ steps.built.outputs.built_at }}
      # From the second try at publishing when there was one, else the first.
      page_url: ${{ steps.again.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Branch name, not SHA: when chained from refresh.yml this picks up
          # the data commit refresh just pushed.
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # When this copy of the site was built: the stamp the verify job looks
      # for on the live site.
      - name: Note what was built
        id: built
        run: npm run -s ci:built-at
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # The archive carries the number of the attempt in its name. A job run
      # again by hand ("Re-run failed jobs") uploads a second archive to the
      # same run; under one name for both, the publishing step would find two
      # and refuse them. (So says the report on the action's own tracker,
      # actions/deploy-pages issue 451. It has not been tried here.)
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: web/dist
      # The publishing step asks GitHub for the archive once, and GitHub does
      # not always know of an archive in the moment after taking it. On 24 Nov
      # 2026 two scheduled refreshes in a row scraped, committed, and then
      # failed here, and the page was left two snapshots behind. In the first
      # (run 45306974744) the archive, asked for 0.3 s after it was stored,
      # was not listed. In the second (run 45510402909) it was listed, and
      # the deployment made from it was reported failed five seconds later;
      # why, GitHub does not say. While building and publishing were two jobs
      # (about nine seconds between the upload and the asking, in the two
      # runs measured) this step failed in no run.
      #
      # So: a pause before publishing, for the first kind of failure, and a
      # second try, a minute later, for whatever is left. The second try
      # sends the same archive under the same deployment id (the commit's),
      # so it is known to help when the archive was not listed, and only
      # hoped to when GitHub fails the deployment itself. Only the first try
      # may fail without ending the job; if the second fails too, the run is
      # red.
      - name: Give GitHub a moment to list the archive
        run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Wait before publishing a second time
        if: steps.deployment.outcome == 'failure'
        run: |
          echo "::notice::The first try at publishing failed (the error above is its own). Trying once more in a minute; the run turns red only if that fails too."
          sleep 60
      - id: again
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

  # A deployment that reports success has not thereby reached the page a
  # person opens: on 23 Nov 2026 one did not, and every step was green. This
  # job looks at the live site and fails, saying what it found, unless the
  # site serves the copy this run built, or a later one, and that copy holds
  # the newest snapshot on the branch (scraper/src/verify-live.ts, which
  # `npm test` covers). The data is committed either way; what a red run here
  # means is that the page is behind.
  verify:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      # The branch as it is now, not the commit this run started from: the
      # newest snapshot on it is what the page has to show.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The site serves what was deployed
        env:
          SITE_URL: ${{ needs.publish.outputs.page_url }}
          BUILT_AT: ${{ needs.publish.outputs.built_at }}
        run: npm run -s ci:verify-live
