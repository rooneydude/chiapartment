name: Refresh prices

on:
  workflow_dispatch:
    inputs:
      buildings:
        description: "Comma-separated building ids (empty = all)"
        required: false
        default: ""
      capture:
        description: "Capture raw responses as fixtures (for adapter development)"
        type: boolean
        default: false
      skyline:
        description: "Regenerate the OSM skyline"
        type: boolean
        default: false
  push:
    # Alternative trigger: commit a change to this file (its words become
    # flags: "capture", "skyline", "buildings=a,b").
    paths: [".github/refresh-trigger"]
  schedule:
    # Every morning, Chicago time (14:00 UTC ≈ 8/9am depending on DST).
    - cron: "0 14 * * *"

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write # price alerts

concurrency:
  group: refresh

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium

      - name: Resolve flags (inputs or trigger file)
        id: flags
        run: |
          # The trigger file's words are flags for the push run that committed
          # it — manual and scheduled runs must not inherit stale flags from it.
          TRIG=""
          if [ "${{ github.event_name }}" = "push" ] && [ -f .github/refresh-trigger ]; then
            TRIG=$(cat .github/refresh-trigger)
          fi
          CAPTURE=false; SKYLINE=false; BUILDINGS="${{ inputs.buildings }}"
          if [ "${{ inputs.capture }}" = "true" ] || echo "$TRIG" | grep -qw capture; then CAPTURE=true; fi
          if [ "${{ inputs.skyline }}" = "true" ] || echo "$TRIG" | grep -qw skyline; then SKYLINE=true; fi
          if [ -z "$BUILDINGS" ]; then BUILDINGS=$(echo "$TRIG" | grep -o 'buildings=[a-z0-9,-]*' | cut -d= -f2 || true); fi
          echo "capture=$CAPTURE" >> "$GITHUB_OUTPUT"
          echo "skyline=$SKYLINE" >> "$GITHUB_OUTPUT"
          echo "buildings=$BUILDINGS" >> "$GITHUB_OUTPUT"

      - name: Generate skyline (when missing or requested)
        if: steps.flags.outputs.skyline == 'true' || hashFiles('data/skyline.geojson') == ''
        continue-on-error: true # a bad Overpass day must not block price scraping
        run: npm run skyline

      - name: Scrape
        run: |
          FLAGS=""
          if [ -n "${{ steps.flags.outputs.buildings }}" ]; then FLAGS="$FLAGS --buildings=${{ steps.flags.outputs.buildings }}"; fi
          if [ "${{ steps.flags.outputs.capture }}" = "true" ]; then FLAGS="$FLAGS --capture"; fi
          npm run refresh -- $FLAGS

      - name: Update unit-position maps
        continue-on-error: true # positional data is a bonus, never a blocker
        run: npm run unitmap

      - name: Price alerts (GitHub issue → phone push via the GitHub app)
        continue-on-error: true # alerting must never fail the scrape
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm run alerts -- --out="$RUNNER_TEMP"
          if [ -f "$RUNNER_TEMP/alert-body.md" ]; then
            gh issue create \
              --title "$(cat "$RUNNER_TEMP/alert-title.txt")" \
              --body-file "$RUNNER_TEMP/alert-body.md" \
              --repo "$GITHUB_REPOSITORY"
          fi

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots data/skyline.geojson data/unitmaps scraper/fixtures 2>/dev/null || git add data/snapshots
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "data: snapshot $(date -u +%FT%TZ)"
            git push
          fi

  deploy:
    needs: scrape
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
