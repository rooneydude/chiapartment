name: Refresh prices

on:
  workflow_dispatch:
    inputs:
      buildings:
        description: "Comma-separated building ids (empty = all)"
        required: false
        default: ""
      capture:
        description: "Capture raw responses as fixtures (for adapter development)"
        type: boolean
        default: false
      skyline:
        description: "Regenerate the OSM skyline"
        type: boolean
        default: false
  push:
    # Alternative trigger: commit a change to this file (its words become
    # flags: "capture", "skyline", "buildings=a,b").
    # Only on the published branch: a refresh commits data and redeploys the
    # site, which a side branch must not do by accident.
    branches: [claude/repo-reset-4my0gv, main]
    paths: [".github/refresh-trigger"]
  schedule:
    # Every morning, Chicago time (14:17 UTC ≈ 8/9am depending on DST).
    # Deliberately NOT on the hour: GitHub queues scheduled runs at :00 for
    # hours (the 14:00 runs of Nov 2026 actually started 18:30–23:20 UTC).
    - cron: "17 14 * * *"

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write # price alerts

concurrency:
  group: refresh

jobs:
  scrape:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.scrape.outputs.ok }}
      total: ${{ steps.scrape.outputs.total }}
      failed: ${{ steps.scrape.outputs.failed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # No tracked building needs a browser today (every adapter reads plain
      # HTTP). Only pay for the Chromium download when one is configured to.
      - name: Does any building need a browser?
        id: browser
        run: |
          if grep -q '"adapter": *"playwright' buildings.json; then echo "needed=true" >> "$GITHUB_OUTPUT"; else echo "needed=false" >> "$GITHUB_OUTPUT"; fi
      - name: Cache Playwright browser
        if: steps.browser.outputs.needed == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        if: steps.browser.outputs.needed == 'true'
        run: |
          # Browser zip comes from Playwright's CDN. `--with-deps` runs
          # apt-get update, which fails the whole daily scrape when the
          # runner's preinstalled Google Chrome repo hash-mismatches
          # (scheduled run 34384381018, 2026-09-09). ubuntu-latest already
          # has the OS libs Chromium needs.
          npx playwright install chromium

      # What this run was asked to do: a manual run's typed-in inputs, or —
      # for a run started by committing a change to .github/refresh-trigger —
      # the words in that file. Worked out by scraper/src/ci-flags.ts, which
      # `npm test` covers: this used to be shell written here, and one line of
      # it stopped the daily refresh on 17 Nov 2026 (run 44099079573).
      - name: Resolve flags (inputs or trigger file)
        id: flags
        env:
          # Typed-in text reaches the program as data, never as script.
          INPUT_BUILDINGS: ${{ inputs.buildings }}
          INPUT_CAPTURE: ${{ inputs.capture }}
          INPUT_SKYLINE: ${{ inputs.skyline }}
        run: npm run -s ci:flags

      - name: Generate skyline (when missing or requested)
        if: steps.flags.outputs.skyline == 'true' || hashFiles('data/skyline.geojson') == ''
        continue-on-error: true # a bad Overpass day must not block price scraping
        run: npm run skyline

      # Writes data/snapshots/<time>.json, a per-building table on this run's
      # summary page, and the outputs ok / total / failed.
      - name: Scrape
        id: scrape
        env:
          # "" for a plain scrape of everything; otherwise the scraper's own
          # flags, built from validated building ids (see ci-flags.ts).
          REFRESH_ARGS: ${{ steps.flags.outputs.refresh_args }}
        run: npm run refresh -- $REFRESH_ARGS

      - name: Update unit-position maps
        continue-on-error: true # positional data is a bonus, never a blocker
        run: npm run unitmap

      # The data is committed BEFORE anyone is alerted, so an alert can never
      # describe a snapshot that failed to land (and be repeated tomorrow).
      # The script retries the push when something else landed on the branch
      # during the scrape, merging the unit maps of two overlapping runs; what
      # does not go together with what landed stops it, pushing nothing.
      # `npm test` runs it against real repositories.
      - name: Commit results
        run: bash .github/scripts/commit-snapshot.sh

      - name: Price alerts (GitHub issue → phone push via the GitHub app)
        continue-on-error: true # alerting must never fail the scrape
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm run alerts -- --out="$RUNNER_TEMP"
          if [ -f "$RUNNER_TEMP/alert-body.md" ]; then
            gh issue create \
              --title "$(cat "$RUNNER_TEMP/alert-title.txt")" \
              --body-file "$RUNNER_TEMP/alert-body.md" \
              --repo "$GITHUB_REPOSITORY"
          fi

  deploy:
    needs: scrape
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  # The snapshot (with its errors) is committed and the dashboard redeployed
  # either way, so the site itself shows what failed. This job only turns the
  # RUN red when not a single building could be read — a dead network or a
  # broken scraper should not look like a quiet day.
  health:
    needs: scrape
    if: needs.scrape.outputs.ok == '0'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::None of the ${{ needs.scrape.outputs.total }} buildings could be scraped (${{ needs.scrape.outputs.failed }}). See the scrape job's summary."
          exit 1
